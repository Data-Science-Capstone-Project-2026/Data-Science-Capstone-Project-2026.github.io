project:
  type: website
  output-dir: _site

# Freeze computational output so GitHub Actions does NOT need R or Python.
# Run `quarto render` locally after changing any code chunk, then commit the
# _freeze/ folder. See the README for details.
execute:
  freeze: auto

website:
  title: "Willamette Applicant Trajectory"
  site-url: https://Data-Science-Capstone-Project-2026.github.io
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: data.qmd
        text: Data
      - href: analysis.qmd
        text: Analysis
      - href: findings.qmd
        text: Findings
    right:
      - icon: github
        href: https://github.com/Data-Science-Capstone-Project-2026/Public_Repository
        aria-label: GitHub

  page-footer:
    left: "© Willamette Applicant Trajectory"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
